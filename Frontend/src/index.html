<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceHub</title>
    <meta name="description" content="Sistema para gerenciar chamados.">
    <!-- <link rel="icon" href="./img/favicon.png"> -->
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>SpaceHub</h1>
        </div>

    </header>
    <main>
        <h2>Bem-vindo ao SpaceHub</h2>
    </main>

    <section id="credenciais">
        <form action="" id="login-form">
            <label for="user">Login:</label>
            <input type="text" id="user" name="user" required>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <button id="login-button" type="submit">Entrar</button>
        </form>
        <p class="register-prompt">
            Ainda não tem uma conta?
            <a href="./pages/register.html">Criar conta</a>
        </p>
    </section>

    <script type="module" src="./scripts/index.js"></script>
</body>
</html>
